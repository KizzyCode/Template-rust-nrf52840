[package]
name = "playground"
version = "0.1.0"
edition = "2021"
resolver = "2"
authors = ["KizzyCode Software Labs./Keziah Biermann <development@kizzycode.de>"]
keywords = []
categories = []
description = "Pure Rust nrf52840 playground"
license = "BSD-2-Clause OR MIT"
readme = "README.md"


[[bin]]
name = "firmware"
path = "src/main.rs"


[features]
default = []


[dependencies]
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.6.0"
embedded-hal = "1.0.0"
nrf52840-hal = "0.19.0"

[dependencies.cortex-m]
version = "0.7.8"
features = ["critical-section-single-core"]


[profile.dev]
overflow-checks = true
opt-level = 0
debug = 2

[profile.release]
debug = 0
overflow-checks = true
strip = "symbols"
